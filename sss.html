<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
  /* ==========================================
   ABOUT DESIGN
========================================== */

        .about-design {
            width: 100%;
            min-height: 550px;

            background: #e8f2fa;

            padding: 50px 30px;

            overflow: hidden;
        }


        /* MAIN CONTAINER */

        .about-wrapper {
            width: 720px;
            max-width: 100%;

            height: 450px;

            margin: auto;

            position: relative;
        }



        /* ==========================================
   COMMON IMAGE STYLE
========================================== */

        .about-image {
            position: absolute;

            background: #fff;

            padding: 5px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);

            transition: all .4s ease;
        }


        .about-image img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }


        /* ==========================================
   FIRST IMAGE
========================================== */

        .image-one {
            width: 390px;
            height: 260px;

            top: 0;
            left: 0;

            z-index: 2;
        }


        .image-one:hover {
            transform: translateY(-8px);
        }


        /* ==========================================
   SECOND IMAGE
========================================== */

        .image-two {
            width: 295px;
            height: 365px;

            top: 38px;
            right: 0;

            z-index: 1;
        }


        .image-two:hover {
            transform: translateY(-8px);
        }


        /* ==========================================
   THIRD IMAGE
========================================== */

        .image-three {
            width: 255px;
            height: 245px;

            left: 235px;
            top: 235px;

            z-index: 5;
        }


        .image-three:hover {
            transform: translateY(-8px);
        }


        /* ==========================================
   TEXT
========================================== */

        .about-text {
            position: absolute;

            width: 225px;

            left: 5px;
            top: 300px;

            z-index: 7;
        }


        .about-text h2 {
            margin: 0 0 12px;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 24px;

            font-weight: 600;

            letter-spacing: 5px;

            color: #3b3b3b;
        }


        .about-text p {
            margin: 0;

            font-family:
                "Cormorant Garamond",
                Georgia,
                serif;

            font-size: 14px;

            line-height: 1.45;

            color: #3e3e3e;
        }


        /* ==========================================
   SIGNATURE
========================================== */

        .about-signature {
            position: absolute;

            right: -5px;
            bottom: -5px;

            z-index: 8;

            font-family:
                "Parisienne",
                cursive;

            font-size: 52px;

            color: #555;

            transform: rotate(-7deg);

            white-space: nowrap;
        }


        /* ==========================================
   TABLET
========================================== */

        @media (max-width: 800px) {

            .about-design {
                padding: 45px 20px;
            }

            .about-wrapper {
                width: 650px;
                height: 500px;
            }

            .image-one {
                width: 350px;
                height: 235px;
            }

            .image-two {
                width: 260px;
                height: 330px;
            }

            .image-three {
                width: 225px;
                height: 215px;

                left: 205px;
                top: 215px;
            }

            .about-text {
                top: 275px;
            }

            .about-signature {
                font-size: 46px;
            }
        }


        /* ==========================================
   MOBILE
========================================== */

        @media (max-width: 600px) {

            .about-design {
                min-height: 680px;

                padding: 35px 15px;
            }

            .about-wrapper {
                width: 100%;
                height: 610px;
            }


            /* FIRST IMAGE */

            .image-one {
                width: 63%;
                height: 190px;

                left: 0;
                top: 0;
            }


            /* SECOND IMAGE */

            .image-two {
                width: 48%;
                height: 245px;

                right: 0;
                top: 35px;
            }


            /* THIRD IMAGE */

            .image-three {
                width: 48%;
                height: 195px;

                left: 27%;
                top: 175px;
            }


            /* TEXT */

            .about-text {
                width: 70%;

                left: 3%;

                top: 395px;
            }


            .about-text h2 {
                font-size: 20px;

                letter-spacing: 4px;

                margin-bottom: 8px;
            }


            .about-text p {
                font-size: 13px;

                line-height: 1.4;
            }


            /* SIGNATURE */

            .about-signature {
                right: 2%;
                bottom: 15px;

                font-size: 42px;
            }

        }


        /* ==========================================
   SMALL MOBILE
========================================== */

        @media (max-width: 400px) {

            .about-design {
                min-height: 640px;
            }


            .about-wrapper {
                height: 570px;
            }


            .image-one {
                width: 65%;
                height: 170px;
            }


            .image-two {
                width: 46%;
                height: 220px;

                top: 30px;
            }


            .image-three {
                width: 48%;
                height: 175px;

                left: 25%;
                top: 155px;
            }


            .about-text {
                top: 350px;

                width: 75%;
            }


            .about-text h2 {
                font-size: 18px;
            }


            .about-text p {
                font-size: 12px;
            }


            .about-signature {
                font-size: 36px;
            }

        }
    </style>
    <section class="about-design" id="about">

        <div class="about-wrapper">

            <!-- LEFT TEXT -->
            <div class="about-text">
                <h2>HI THERE!</h2>

                <p>
                    Ice cream tootsie roll fruitcake danish.
                    Bear claw lemon drops powder oat cake
                    dessert marzipan chocolate bar sugar
                    plum gummies. Cake powder dessert
                    brownie apple pie.
                </p>
            </div>


            <!-- IMAGE 1 -->
            <div class="about-image image-one">
                <img src="images/about-1.jpg" alt="Travel">
            </div>


            <!-- IMAGE 2 -->
            <div class="about-image image-two">
                <img src="images/about-2.jpg" alt="Flowers">
            </div>


            <!-- IMAGE 3 -->
            <div class="about-image image-three">
                <img src="images/about-3.jpg" alt="Lifestyle">
            </div>


            <!-- SIGNATURE -->
            <div class="about-signature">
                Camille
            </div>

        </div>

    </section>
</body>

</html>
