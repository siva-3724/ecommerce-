<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="https://cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <link rel="stylesheet" href="style.css">
    <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 20px 8%;
    }

    .header h1 {
      font-size: 24px;
    }



    .checkout-container {
      width: 90%;
      max-width: 1200px;
      margin: 40px auto;
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
    }

    .product {
      display: flex;
      gap: 15px;
      align-items: center;
      padding-bottom: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
    }

    .product img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .product-info p {
      color: #666;
      font-size: 14px;
    }

    .price {
      font-weight: bold;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 14px 0;
      color: #555;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 18px;
      margin-top: 18px;
      font-size: 20px;
      font-weight: bold;
      color: #111;
    }

    .place-order {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }

    .place-order:hover {
      background: #1d4ed8;
    }

    .secure {
      text-align: center;
      margin-top: 15px;
      color: #777;
      font-size: 13px;
    }
    

    @media (max-width: 768px) {
      .checkout-container {
        grid-template-columns: 1fr;
        margin-top: 25px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <!--navbar-->
    <header class="site-header">
    <div class="container nav">

      <!-- Mobile Menu -->
      <div class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">
        ☰
      </div>

      <!-- Logo -->
      <a href="#home" class="brand">
        SIVA & HERB OILS
      </a>

      <!-- Navigation -->
      <nav id="navLinks">
        <a class="active" href="index.html">Home</a>
        <a href="seller.html">About Us</a>
        <a href="catalog.html">Shop</a>
        <a href="contact.html">Contact Us</a>
      </nav>

      <!-- Navigation Actions -->
        <div class="nav-actions">

        <!-- Search -->
        <div class="search-container">
          <form action="" class="search-form">

            <input type="text" name="search" placeholder="Search..." aria-label="Search">

            <button type="submit" aria-label="Search">
              <i class="fa fa-search"></i>
            </button>

          </form>
        </div>


        <!-- Cart -->
        <a href="add to card .html" class="cart-link" aria-label="Shopping Cart">

          <div class="icon">
            🛒
          </div>

          <span class="cart-count">3</span>

        </a>

      </div>

    </div>
 
  <header class="header">
    
    <n type="">
                <a href="p1.html">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#5985E1">
                        <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z" />
                    </svg>
                </a>
              </n>

       <h1>Product Checkout</h1>
   
  </header>

  <main class="checkout-container">

    <!-- Left Section -->
    <section>

      <!-- Customer Details -->
      <div class="card">
        <h2>Customer Details</h2>

        <div class="form-row">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="siva" />
          </div>

          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="prasath" />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="sivaprasath@gamil.com" />
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="+91 9345668970" />
          </div>
        </div>
      </div>

      <!-- Shipping Address -->
      <div class="card">
        <h2>Shipping Address</h2>

        <div class="form-row">
          <div class="form-group full">
            <label for="address">Street Address</label>
            <input type="text" id="address" placeholder="205 2nd Street" />
          </div>

          <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" placeholder="salem" />
          </div>

          <div class="form-group">
            <label for="state">State</label>
            <select id="state">
              <option value="">Select State</option>
              <option>Tamil Nadu</option>
              <option>Karnataka</option>
              <option>Kerala</option>
              <option>Maharashtra</option>
              <option>Telangana</option>
            </select>
          </div>

          <div class="form-group">
            <label for="zip">PIN Code</label>
            <input type="text" id="zip" placeholder="636636" />
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country">
              <option>India</option>
              <option>United States</option>
              <option>United Kingdom</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Payment -->
      <div class="card">
        <h2>Payment Method</h2>

        <label class="payment-option">
          <input type="radio" name="payment" value="card" checked />
          Credit / Debit Card
          <div class="icon-container">
             <div class="payments">
          <span style="background-color: #1d4ed8; color: white;">VISA</span>
          <span style="background-color: rgb(244, 121, 32); color: white;">RuPay</span>
           </div>

          </div>

        </label>

        <label class="payment-option">
          <input type="radio" name="payment" value="upi" />
          UPI
          <div class="icon-container">
             <div class="payments">
          <span style="background-color: gray; color: white;">G Pay</span>
          <span style="background-color: rgb(49, 170, 240); color: white;">Patm</span>
           </div>
            


          </div>

        </label>

        <label class="payment-option">
          <input type="radio" name="payment" value="cod" />
          Cash on Delivery
          <div class="icon-container">
            <div class="payments">
          <span style="background-color: gray; color: white; font-size: 20px;">₹</span>
          
          <span style="background-color: gray; color: rgb(29, 248, 36); font-size: 20px;">$</span>
           </div>
            
          </div>
        </label>
      </div>

    </section>

    <!-- Right Section -->
    <aside>

      <div class="card">
        <h2>Order Summary</h2>

        <div class="product">
          <img src="assets/product-1.jpg" alt="Product" />

          <div class="product-info">
            <h3>Cold Pressed Coconut Oil</h3>
            <p>Quantity: 1</p>
          </div>

          <span class="price">₹299</span>
        </div>

        <div class="summary-row">
          <span>Subtotal</span>
          <span>₹299</span>
        </div>

        <div class="summary-row">
          <span>Shipping</span>
          <span>₹10</span>
        </div>



        <div class="summary-row total">
          <span>Total</span>
          <span>₹319</span>
        </div>

        <button class="place-order" onclick="placeOrder()">
          Place Order
        </button>

        <p class="secure">
          🔒 Secure checkout · Your payment is protected
        </p>
      </div>

    </aside>

  </main>



</body>
<script
 src="script.js"></script>
</html>
